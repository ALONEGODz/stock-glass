<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบสต๊อกแก้ว</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1c1e21; --sub:#6b7280; --border:#e5e7eb;
  --accent:#2563eb; --accent-ink:#ffffff; --danger:#dc2626; --ok:#16a34a; --warn:#d97706; --chip:#eef2ff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171b; --card:#1f2227; --text:#f0f1f3; --sub:#9aa1ab; --border:#33373e;
    --accent:#3b82f6; --accent-ink:#0b1220; --danger:#f87171; --ok:#4ade80; --warn:#fbbf24; --chip:#1e2a4a; }
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;}
header{position:sticky; top:0; padding:14px 16px 12px; background:var(--bg); border-bottom:1px solid var(--border); z-index:5;}
h1{font-size:18px; margin:0 0 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.badge{font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--accent); font-weight:600;}
.badge.ro{background:var(--chip); color:var(--sub);}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
input[type=text],select,input[type=number],input[type=email]{
  font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--card); color:var(--text); outline:none;
}
input[type=text]{flex:1; min-width:140px;}
.authbox{display:flex; align-items:center; gap:8px; font-size:12px;}
.authbox button{font-size:12px; padding:6px 10px; border-radius:7px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer;}
.authbox button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
.tabs{display:flex; gap:6px; overflow-x:auto; padding:10px 16px 0; -webkit-overflow-scrolling:touch;}
.tab{white-space:nowrap; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--sub); font-size:13px; cursor:pointer;}
.tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
main{padding:14px 16px 90px; max-width:1100px; margin:0 auto;}
.summary{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; font-size:12px; color:var(--sub);}
.summary b{color:var(--text);}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column;}
.thumb{aspect-ratio:1/1; background:var(--chip); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:default;}
.thumb.clickable{cursor:zoom-in;}
.thumb img{width:100%; height:100%; object-fit:cover;}
.thumb .ph{color:var(--sub); font-size:28px;}
.lightbox{position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:40; padding:24px;}
.lightbox img{max-width:min(95vw,720px); max-height:88vh; border-radius:12px; background:#fff;}
.lightbox .lbclose{position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; background:rgba(255,255,255,.15); color:#fff; border:none; width:36px; height:36px; border-radius:999px; font-size:18px; cursor:pointer;}
.cbody{padding:10px; display:flex; flex-direction:column; gap:4px; flex:1;}
.ccode{font-size:11px; color:var(--sub); font-family:monospace;}
.cname{font-size:13px; font-weight:600; line-height:1.3;}
.ccolor{font-size:12px; color:var(--sub);}
.cqty{font-size:20px; font-weight:700; margin-top:2px;}
.cqty.zero{color:var(--danger);} .cqty.low{color:var(--warn);} .cqty.ok{color:var(--ok);}
.cpending{font-size:11px; color:var(--sub);}
.cactions{display:flex; gap:6px; margin-top:6px;}
.cactions button{flex:1; font-size:12px; padding:6px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer;}
.cactions button.danger{color:var(--danger); border-color:var(--danger);}
.fab{position:fixed; right:16px; bottom:20px; background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px; padding:13px 18px; font-size:14px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; z-index:6;}
.empty{text-align:center; color:var(--sub); padding:60px 20px; font-size:13px;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:20;}
@media (min-width:640px){ .overlay{align-items:center;} }
.modal{background:var(--card); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:18px;}
@media (min-width:640px){ .modal{border-radius:16px;} }
.modal h2{margin:0 0 12px; font-size:16px;}
.field{margin-bottom:10px; display:flex; flex-direction:column; gap:4px;}
.field label{font-size:12px; color:var(--sub);}
.field input,.field select{width:100%;}
.imgpick{display:flex; gap:10px; align-items:center;}
.imgpick .prev{width:64px; height:64px; border-radius:8px; background:var(--chip); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.imgpick .prev img{width:100%; height:100%; object-fit:cover;}
.modalbtns{display:flex; gap:8px; margin-top:14px;}
.modalbtns button{flex:1; padding:11px; border-radius:9px; border:1px solid var(--border); font-size:14px; cursor:pointer; background:var(--bg); color:var(--text);}
.modalbtns button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700;}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; z-index:30; opacity:0; transition:opacity .2s;}
.toast.show{opacity:1;}
.howto{font-size:12px; color:var(--sub); line-height:1.6; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:14px;}
.howto b{color:var(--text);}
.adminpanel{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:14px; font-size:13px;}
.adminpanel h3{margin:0 0 8px; font-size:13px;}
.editorrow{display:flex; gap:8px; align-items:center; padding:4px 0; font-size:12px;}
.editorrow span{flex:1;}
.editorrow button{font-size:11px; padding:3px 8px; border-radius:6px; border:1px solid var(--danger); color:var(--danger); background:none; cursor:pointer;}
.addeditor{display:flex; gap:6px; margin-top:8px;}
.addeditor input{flex:1;}
.addeditor button{padding:8px 12px; border-radius:7px; border:none; background:var(--accent); color:var(--accent-ink); font-size:12px; cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>📦 สต๊อกแก้ว <span id="modeBadge" class="badge ro">กำลังโหลด…</span></h1>
  <div class="toolbar">
    <input type="text" id="search" placeholder="ค้นหา รหัส / ชื่อ / สี...">
    <div class="authbox" id="authbox"></div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div class="howto" id="howto"></div>
  <div class="adminpanel" id="adminPanel" style="display:none"></div>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">ไม่พบสินค้า</div>
</main>

<button class="fab" id="addBtn" style="display:none">＋ เพิ่มสินค้า</button>

<div class="overlay" id="overlay" style="display:none">
  <div class="modal">
    <h2 id="modalTitle">เพิ่มสินค้า</h2>
    <div class="field"><label>หมวดหมู่</label><select id="f_category"></select></div>
    <div class="field"><label>รหัส ERP</label><input type="text" id="f_erp"></div>
    <div class="field"><label>รหัสสินค้า</label><input type="text" id="f_code"></div>
    <div class="field"><label>ชื่อ/ขนาด</label><input type="text" id="f_name"></div>
    <div class="field"><label>สี</label><input type="text" id="f_color"></div>
    <div class="field"><label>จำนวนคงเหลือ</label><input type="number" id="f_qty"></div>
    <div class="field"><label>รอใช้ออเดอร์ (ถ้ามี)</label><input type="text" id="f_pending"></div>
    <div class="field"><label>รูปภาพ</label>
      <div class="imgpick"><div class="prev" id="f_imgprev">🖼️</div><input type="file" id="f_imgfile" accept="image/*"></div>
    </div>
    <div class="modalbtns"><button id="cancelBtn">ยกเลิก</button><button class="primary" id="saveBtn">บันทึก</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

const CATEGORIES = ["Vacuum Mug", "Vacuum Bottle", "Vacuum Flask", "แก้วมัค", "Ceramic series"];

let currentUser = null;
let canEdit = false;
let isSuperAdmin = false;
let products = [];
let currentTab = 'ALL';
let editingId = null;

const $ = (id) => document.getElementById(id);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function renderAuthbox(){
  const box = $('authbox');
  if(currentUser){
    box.innerHTML = `<span>${currentUser.email}</span><button id="signOutBtn">ออกจากระบบ</button>`;
    $('signOutBtn').onclick = () => signOut(auth);
  } else {
    box.innerHTML = `<button class="primary" id="signInBtn">เข้าสู่ระบบเพื่อแก้ไข</button>`;
    $('signInBtn').onclick = () => signInWithPopup(auth, provider).catch(e => toast('เข้าสู่ระบบไม่สำเร็จ'));
  }
}

function renderTabs(){
  const tabs = $('tabs'); tabs.innerHTML = '';
  const mk = (label, val) => {
    const b = document.createElement('div');
    b.className = 'tab' + (currentTab===val?' active':'');
    b.textContent = label;
    b.onclick = () => { currentTab = val; render(); };
    tabs.appendChild(b);
  };
  mk('ทั้งหมด', 'ALL');
  CATEGORIES.forEach(c => mk(c, c));
}

function qtyClass(q){ if(!q || q<=0) return 'zero'; if(q<20) return 'low'; return 'ok'; }

function render(){
  renderTabs();
  const q = $('search').value.trim().toLowerCase();
  let items = products;
  if(currentTab !== 'ALL') items = items.filter(p => p.category === currentTab);
  if(q) items = items.filter(p =>
    (p.code||'').toLowerCase().includes(q) || (p.erp_code||'').toLowerCase().includes(q) ||
    (p.name||'').toLowerCase().includes(q) || (p.color||'').toLowerCase().includes(q));

  const grid = $('grid'); grid.innerHTML = '';
  $('empty').style.display = items.length ? 'none' : 'block';

  const total = items.length;
  const zero = items.filter(p=>!p.qty || p.qty<=0).length;
  const low = items.filter(p=>p.qty>0 && p.qty<20).length;
  $('summary').innerHTML = `<span><b>${total}</b> รายการ</span><span>หมดสต๊อก: <b style="color:var(--danger)">${zero}</b></span><span>ใกล้หมด (&lt;20): <b style="color:var(--warn)">${low}</b></span>`;

  items.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    const qc = qtyClass(p.qty);
    card.innerHTML = `
      <div class="thumb${p.img ? ' clickable' : ''}" ${p.img ? `data-lightbox="${p.img.startsWith('data:')?p.img:'data:image/jpeg;base64,'+p.img}"` : ''}>${p.img ? `<img src="${p.img.startsWith('data:')?p.img:'data:image/jpeg;base64,'+p.img}">` : `<div class="ph">🥤</div>`}</div>
      <div class="cbody">
        <div class="ccode">${p.code || p.erp_code || ''}</div>
        <div class="cname">${p.name || ''}</div>
        <div class="ccolor">${p.color || ''}</div>
        <div class="cqty ${qc}">${p.qty ?? 0} ชิ้น</div>
        ${p.pending ? `<div class="cpending">รอออเดอร์: ${p.pending}</div>` : ''}
        ${canEdit ? `<div class="cactions">
          <button data-act="edit" data-id="${p.id}">แก้ไข</button>
          <button data-act="del" data-id="${p.id}" class="danger">ลบ</button>
        </div>` : ''}
      </div>`;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.thumb.clickable').forEach(el => {
    el.onclick = () => openLightbox(el.dataset.lightbox);
  });

  grid.querySelectorAll('button[data-act]').forEach(btn => {
    btn.onclick = () => {
      const item = products.find(p => p.id === btn.dataset.id);
      if(btn.dataset.act === 'edit') openModal(item);
      else if(btn.dataset.act === 'del') deleteItem(item);
    };
  });
}

function openLightbox(src){
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<button class="lbclose">✕</button><img src="${src}">`;
  lb.onclick = (e) => { if(e.target === lb || e.target.classList.contains('lbclose')) lb.remove(); };
  document.body.appendChild(lb);
}

function openModal(item){
  editingId = item ? item.id : null;
  $('modalTitle').textContent = item ? 'แก้ไขสินค้า' : 'เพิ่มสินค้า';
  const sel = $('f_category');
  sel.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  sel.value = item ? item.category : CATEGORIES[0];
  $('f_erp').value = item ? item.erp_code : '';
  $('f_code').value = item ? item.code : '';
  $('f_name').value = item ? item.name : '';
  $('f_color').value = item ? item.color : '';
  $('f_qty').value = item ? item.qty : 0;
  $('f_pending').value = item ? item.pending : '';
  $('f_imgfile').value = '';
  const imgSrc = item && item.img ? (item.img.startsWith('data:') ? item.img : 'data:image/jpeg;base64,'+item.img) : null;
  $('f_imgprev').innerHTML = imgSrc ? `<img src="${imgSrc}">` : '🖼️';
  $('f_imgprev').dataset.b64 = item && item.img ? item.img : '';
  $('overlay').style.display = 'flex';
}
function closeModal(){ $('overlay').style.display = 'none'; editingId = null; }
$('addBtn').onclick = () => openModal(null);
$('cancelBtn').onclick = closeModal;

$('f_imgfile').onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxdim = 160;
      let w = img.width, h = img.height;
      if(w > h){ if(w>maxdim){ h = Math.round(h*maxdim/w); w = maxdim; } }
      else { if(h>maxdim){ w = Math.round(w*maxdim/h); h = maxdim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      $('f_imgprev').innerHTML = `<img src="${dataUrl}">`;
      $('f_imgprev').dataset.b64 = dataUrl;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

$('saveBtn').onclick = async () => {
  if(!canEdit){ toast('คุณไม่มีสิทธิ์แก้ไข'); return; }
  const item = {
    id: editingId || ('P' + Date.now()),
    category: $('f_category').value,
    erp_code: $('f_erp').value.trim(),
    code: $('f_code').value.trim(),
    name: $('f_name').value.trim(),
    color: $('f_color').value.trim(),
    qty: parseInt($('f_qty').value) || 0,
    pending: $('f_pending').value.trim(),
    img: $('f_imgprev').dataset.b64 || null,
    updatedAt: Date.now(),
    updatedBy: currentUser ? currentUser.email : null,
  };
  if(!item.name){ toast('กรุณากรอกชื่อสินค้า'); return; }
  try{
    await setDoc(doc(db, 'products', item.id), item);
    toast('บันทึกแล้ว'); closeModal();
  }catch(err){ toast('บันทึกไม่สำเร็จ: ' + err.message); }
};

async function deleteItem(item){
  if(!canEdit) return;
  if(!confirm('ลบสินค้า "' + item.name + '" ใช่หรือไม่?')) return;
  try{ await deleteDoc(doc(db, 'products', item.id)); toast('ลบแล้ว'); }
  catch(err){ toast('ลบไม่สำเร็จ: ' + err.message); }
}

$('search').oninput = render;

async function seedIfEmpty(){
  const snap = await getDocs(collection(db, 'products'));
  if(!snap.empty) { toast('มีข้อมูลอยู่แล้ว ไม่ seed ซ้ำ'); return; }
  const batch = writeBatch(db);
  SEED_PRODUCTS.forEach(p => {
    const ref = doc(db, 'products', p.id);
    batch.set(ref, { ...p, img: p.img ? ('data:image/jpeg;base64,'+p.img) : null, updatedAt: Date.now() });
  });
  await batch.commit();
  toast('โหลดข้อมูลเริ่มต้นสำเร็จ (' + SEED_PRODUCTS.length + ' รายการ)');
}

async function renderAdminPanel(){
  const panel = $('adminPanel');
  if(!isSuperAdmin){ panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  const snap = await getDocs(collection(db, 'products'));
  const editorsSnap = await getDocs(collection(db, 'editors'));
  const editors = editorsSnap.docs.map(d => d.id);
  panel.innerHTML = `<h3>⚙️ แผงผู้ดูแล (เห็นเฉพาะคุณ)</h3>` +
    (snap.empty ? `<button id="seedBtn" style="padding:8px 12px;border-radius:7px;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-bottom:10px;">โหลดข้อมูลเริ่มต้นจากไฟล์ Excel (${SEED_PRODUCTS.length} รายการ)</button>` : `<div style="color:var(--sub);margin-bottom:8px;">มีสินค้าในระบบแล้ว ${snap.size} รายการ</div>`) +
    `<div>รายชื่อผู้มีสิทธิ์แก้ไข:</div>` +
    editors.map(e => `<div class="editorrow"><span>${e}</span><button data-email="${e}" class="rmEditor">ลบสิทธิ์</button></div>`).join('') +
    `<div class="addeditor"><input type="email" id="newEditorEmail" placeholder="อีเมล Gmail ของพนักงาน"><button id="addEditorBtn">เพิ่มสิทธิ์แก้ไข</button></div>`;

  const seedBtn = $('seedBtn');
  if(seedBtn) seedBtn.onclick = () => seedIfEmpty().then(renderAdminPanel);

  panel.querySelectorAll('.rmEditor').forEach(b => {
    b.onclick = async () => {
      await deleteDoc(doc(db, 'editors', b.dataset.email));
      toast('ลบสิทธิ์แล้ว'); renderAdminPanel();
    };
  });
  $('addEditorBtn').onclick = async () => {
    const email = $('newEditorEmail').value.trim().toLowerCase();
    if(!email) return;
    await setDoc(doc(db, 'editors', email), { allowed: true, addedAt: Date.now() });
    toast('เพิ่มสิทธิ์แล้ว'); renderAdminPanel();
  };
}

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  isSuperAdmin = !!(user && user.email && user.email.toLowerCase() === SUPERADMIN_EMAIL.toLowerCase());
  canEdit = false;
  if(user){
    try{
      const edoc = await getDoc(doc(db, 'editors', user.email.toLowerCase()));
      canEdit = isSuperAdmin || edoc.exists();
    }catch(e){ canEdit = isSuperAdmin; }
  }
  renderAuthbox();
  $('modeBadge').textContent = canEdit ? 'โหมดแก้ไข' : 'โหมดดูอย่างเดียว';
  $('modeBadge').className = canEdit ? 'badge' : 'badge ro';
  $('addBtn').style.display = canEdit ? 'block' : 'none';
  renderAdminPanel();
  render();
});

onSnapshot(collection(db, 'products'), (snap) => {
  products = snap.docs.map(d => d.data());
  render();
}, (err) => {
  toast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ ตรวจสอบ firebaseConfig');
});

  '<b>วิธีใช้:</b> ดูสต๊อกได้ทุกคนโดยไม่ต้องล็อกอิน · พนักงานที่ต้องการแก้ไข ให้กด "เข้าสู่ระบบเพื่อแก้ไข" ด้วย Gmail แล้วรอผู้ดูแลเพิ่มสิทธิ์ให้ · ข้อมูลอัปเดตแบบเรียลไทม์ให้ทุกคนที่เปิดหน้าอยู่';

render();
