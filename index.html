:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#1c1e21; --sub:#6b7280; --border:#e5e7eb;
  --blue:#2f6fed; --blue-ink:#ffffff; --blue-soft:#eaf0ff;
  --orange:#f5871f; --orange-soft:#fff1e2;
  --mint:#12b591; --mint-soft:#e1faf3;
  --slate:#64748b; --slate-soft:#eef1f5;
  --purple:#8b5cf6; --purple-soft:#f0eaff;
  --sidebar:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --card:#1e2126; --text:#f1f2f4; --sub:#9aa1ab; --border:#31353c;
    --blue:#5b8bff; --blue-ink:#0b1220; --blue-soft:#1c2740;
    --orange:#ff9f45; --orange-soft:#3a2a17;
    --mint:#2fe0b4; --mint-soft:#0f2e27;
    --slate:#9aa4b2; --slate-soft:#262b33;
    --purple:#a78bfa; --purple-soft:#2a2140;
    --sidebar:#191b20;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --card:#1e2126; --text:#f1f2f4; --sub:#9aa1ab; --border:#31353c;
  --blue:#5b8bff; --blue-ink:#0b1220; --blue-soft:#1c2740;
  --orange:#ff9f45; --orange-soft:#3a2a17;
  --mint:#2fe0b4; --mint-soft:#0f2e27;
  --slate:#9aa4b2; --slate-soft:#262b33;
  --purple:#a78bfa; --purple-soft:#2a2140;
  --sidebar:#191b20;
}
*{box-sizing:border-box;}
html,body{height:100%; margin:0;}
body{background:var(--bg); color:var(--text); font-family:'FC Minimal',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;}

.app{display:flex; min-height:100%;}
.sidebar{width:220px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--border); padding:16px 12px; position:fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index:15; transition:transform .2s;}
.sidebarhead{display:flex; align-items:center; gap:9px; padding:0 6px 18px;}
.sidebarhead .logo{height:32px; width:auto; object-fit:contain;}
.sidebarhead .brandtext{font-weight:800; font-size:13px; line-height:1.15;}
.sidebarhead .brandtext span{background:linear-gradient(90deg,var(--mint),var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.sidebarhead .logo-full{height:34px; width:auto; object-fit:contain; display:none;}
.sidebarhead .logo-dark-group{display:flex; align-items:center; gap:9px;}
:root[data-theme="light"] .logo-full{display:block;}
:root[data-theme="light"] .logo-dark-group{display:none;}
:root[data-theme="dark"] .logo-full{display:none;}
:root[data-theme="dark"] .logo-dark-group{display:flex;}
@media (prefers-color-scheme: light){
  :root:not([data-theme]) .logo-full{display:block;}
  :root:not([data-theme]) .logo-dark-group{display:none;}
}
.navitem{padding:10px 10px; border-radius:9px; font-size:13px; color:var(--sub); cursor:pointer; display:flex; align-items:center; gap:8px; margin-bottom:2px;}
.navitem:hover{background:var(--bg);}
.navitem.active{background:var(--blue-soft); color:var(--blue); font-weight:700;}
.navitem.disabled{opacity:.4; cursor:default;}
.navsub{margin-left:14px; border-left:2px solid var(--border); padding-left:10px; margin-bottom:6px;}
.navsub .navitem{font-size:12.5px; padding:7px 8px;}
.sidebar-overlay{display:none;}

.mainarea{flex:1; margin-left:220px; min-width:0;}
.topbar{position:sticky; top:0; z-index:8; background:var(--card); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.hamburger{display:none; background:none; border:1px solid var(--border); border-radius:8px; width:36px; height:36px; font-size:16px; cursor:pointer; color:var(--text);}
.topbar input[type=text]{flex:1; max-width:420px; font-size:14px; padding:9px 12px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); outline:none;}
.topbtns{display:flex; align-items:center; gap:12px; margin-left:auto; flex-wrap:wrap;}
.bellwrap{position:relative;}
.bell{position:relative; font-size:18px; cursor:pointer;}
.bellcount{position:absolute; top:-4px; right:-8px; background:var(--orange); color:#fff; font-size:9px; font-weight:700; border-radius:999px; padding:1px 5px; display:none;}
.bellmenu{position:absolute; top:32px; right:-8px; z-index:40; background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 28px rgba(0,0,0,.18); width:300px; max-height:70vh; overflow-y:auto; display:none;}
.bellmenu.show{display:block;}
.bellmenu .bmhead{font-size:12.5px; font-weight:800; padding:12px 14px 8px; color:var(--text);}
.bellmenu .bmrow{display:flex; align-items:center; gap:9px; padding:8px 14px; cursor:pointer; border-top:1px solid var(--border);}
.bellmenu .bmrow:hover{background:var(--bg);}
.bellmenu .bmthumb{width:34px; height:34px; border-radius:8px; overflow:hidden; background:var(--bg); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px;}
.bellmenu .bmthumb img{width:100%; height:100%; object-fit:cover;}
.bellmenu .bminfo{flex:1; min-width:0;}
.bellmenu .bmcode{font-size:11.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bellmenu .bmsub{font-size:10.5px; color:var(--sub);}
.bellmenu .bmqty{font-size:11.5px; font-weight:800; white-space:nowrap;}
.bellmenu .bmqty.low{color:var(--orange);} .bellmenu .bmqty.zero{color:var(--slate);}
.bellmenu .bmempty{padding:16px 14px; font-size:12px; color:var(--sub); text-align:center;}
.bellmenu .bmmore{padding:9px 14px; font-size:11.5px; color:var(--sub); text-align:center; border-top:1px solid var(--border);}
.themebtn{width:36px; height:36px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.themebtn:hover{background:var(--card);}
button.btn{font-size:12.5px; padding:8px 13px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; white-space:nowrap;}
button.btn.primary{background:var(--blue); color:var(--blue-ink); border-color:var(--blue); font-weight:700;}

main{padding:20px calc(20px + env(safe-area-inset-right,0px)) 90px 20px;}
.pagehead{margin-bottom:16px;}
.pagehead h1{font-size:19px; margin:0 0 4px;}
.pagehead .meta{font-size:12px; color:var(--sub);}
.howto{font-size:12px; color:var(--sub); line-height:1.6; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:16px;}
.howto b{color:var(--text);}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:20px;}
.stat{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:12px;}
.stat .icon{width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.stat.total .icon{background:var(--blue-soft); color:var(--blue);}
.stat.qty .icon{background:var(--mint-soft); color:var(--mint);}
.stat.pending .icon{background:var(--orange-soft); color:var(--orange);}
.stat.incoming .icon{background:var(--purple-soft); color:var(--purple);}
.stat.low .icon{background:var(--orange-soft); color:var(--orange);}
.stat.zero .icon{background:var(--slate-soft); color:var(--slate);}
.stat .label{font-size:11px; color:var(--sub);}
.stat .value{font-size:20px; font-weight:800;}
.stat.total .value{color:var(--blue);} .stat.qty .value{color:var(--mint);}
.stat.pending .value{color:var(--orange);} .stat.incoming .value{color:var(--purple);}
.stat.low .value{color:var(--orange);} .stat.zero .value{color:var(--slate);}

.sectiontitle{font-size:14px; font-weight:700; margin:0 0 12px;}
.catcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:24px;}
.catcard{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; gap:12px; align-items:center;}
.catcard.active{border-color:var(--mint); box-shadow:0 0 0 2px var(--mint-soft);}
.catcard .catimg{width:104px; height:104px; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; font-size:24px;}
.catcard .catimg img{width:100%; height:100%; object-fit:cover; object-position:center;}
.catcard .catinfo{flex:1; min-width:0;}
.catcard .catname{font-weight:700; font-size:15px; margin-bottom:6px; color:var(--blue);}
.catcard .catstatsrow{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:8px;}
.catcard .catstat{font-size:10.5px; color:var(--sub);}
.catcard .catstat b{display:block; font-size:13px; color:var(--text); margin-top:2px;}
.catcard button{margin-top:0; width:100%; font-size:12px; padding:7px; border-radius:8px; border:1px solid var(--mint); background:var(--mint-soft); color:var(--mint); font-weight:700; cursor:pointer;}
.herobanner{position:relative; border-radius:18px; overflow:hidden; margin-bottom:20px; background:#f3ece1; line-height:0;}
.herobanner img{width:100%; height:auto; display:block;}
.herocta{position:absolute; left:4%; bottom:8%; font-size:13px; padding:11px 20px; border-radius:999px; border:none; background:var(--mint); color:#04352b; font-weight:700; cursor:pointer; line-height:normal; box-shadow:0 4px 14px rgba(0,0,0,.15);}
.stat .value .unit{font-size:11px; font-weight:600; color:var(--sub);}
.stat.models{position:relative; padding-right:52px;}
.stat.models .icon{background:var(--purple-soft); color:var(--purple);}
.stat.models .value{color:var(--purple);}
.stat.models .manualtag{font-size:9.5px; font-weight:600; color:var(--purple); text-transform:none;}
.stat.models .automismatch{font-size:9.5px; color:var(--orange); margin-top:2px;}
.modelbreak{margin-bottom:10px; border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
.modelbreak summary{cursor:pointer; font-size:13px; font-weight:700;}
.modelbreak .alerttable{margin-top:10px;}
.statedit{position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:4px;}
.statedit button{width:22px; height:22px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center;}

.alerttable{background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:10px;}
.alerttable table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px;}
.alerttable th{text-align:left; padding:10px 12px; font-size:10.5px; color:var(--sub); text-transform:uppercase; background:var(--bg); border-bottom:1px solid var(--border); position:sticky; top:calc(64px + env(safe-area-inset-top,0px)); z-index:3;}
.alerttable td{padding:9px 12px; border-bottom:1px solid var(--border);}
.alerttable tr:last-child td{border-bottom:none;}

.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.toolbar input[type=text]{flex:1; min-width:160px; font-size:13.5px; padding:9px 12px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text); outline:none;}
.toolbar select{font-size:13px; padding:9px 10px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text);}
.toolbar .spacer{flex:1;}
.toolbar button.addnew{font-size:13px; padding:9px 14px; border-radius:9px; border:none; background:var(--blue); color:var(--blue-ink); font-weight:700; cursor:pointer; white-space:nowrap;}

.pgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:18px;}
.pcard{background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; position:relative; display:flex; flex-direction:column; padding:12px;}
.pstatus{position:absolute; top:9px; left:9px; font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; z-index:2;}
.pstatus.ok{background:var(--mint-soft); color:var(--mint);}
.pstatus.low{background:var(--orange-soft); color:var(--orange);}
.pstatus.zero{background:var(--slate-soft); color:var(--slate);}
.pkebab{position:absolute; top:8px; right:8px; z-index:3; background:none; border:none; color:var(--sub); font-size:16px; font-weight:800; cursor:pointer; padding:2px 6px; line-height:1;}
.pkebabmenu{position:absolute; top:30px; right:8px; z-index:5; background:var(--card); border:1px solid var(--border); border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.15); display:none; overflow:hidden; min-width:110px;}
.pkebabmenu.show{display:block;}
.pkebabmenu button{display:block; width:100%; text-align:left; font-size:12.5px; padding:9px 12px; border:none; background:none; color:var(--text); cursor:pointer;}
.pkebabmenu button:hover{background:var(--bg);}
.pkebabmenu button.danger{color:#e5484d;}
.pcardtop{display:flex; gap:10px; margin-bottom:10px;}
.pimg{width:92px; flex-shrink:0; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:default; align-self:stretch;}
.pimg.clickable{cursor:zoom-in;}
.pimg img{width:100%; height:100%; object-fit:cover;}
.pimg .ph{font-size:26px; color:var(--sub);}
.pinfo{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; padding-top:2px;}
.pcode{font-weight:700; font-size:12.5px; line-height:1.3; word-break:break-word;}
.prow{display:flex; justify-content:space-between; gap:6px; font-size:11.5px; color:var(--sub);}
.prow b{color:var(--text); font-weight:700; text-align:right;}
.colordot{display:inline-block; width:9px; height:9px; border-radius:999px; margin-right:5px; border:1px solid rgba(0,0,0,.15); vertical-align:middle;}
.stockbox{border-top:1px dashed var(--border); padding-top:8px; margin-top:2px; display:flex; flex-direction:column; gap:5px;}
.stocktitle{font-size:11px; font-weight:700; color:var(--sub); margin-bottom:1px;}
.stockbox .prow b.qty-ok{color:var(--mint); font-size:14px;}
.stockbox .prow b.qty-low{color:var(--orange); font-size:14px;}
.stockbox .prow b.qty-zero{color:var(--slate); font-size:14px;}
.stockbox .prow b.pendingval{color:var(--orange);}
.stockbox .prow b.incomingval{color:var(--purple);}
.pfooter{display:flex; justify-content:space-between; align-items:center; gap:6px; border-top:1px solid var(--border); margin-top:9px; padding-top:8px; font-size:11px; color:var(--sub);}
.pfooter .datebadge{display:flex; align-items:center; gap:5px;}
.pfooter .datebadge .dot{width:16px; height:16px; border-radius:999px; background:var(--mint-soft); color:var(--mint); display:inline-flex; align-items:center; justify-content:center; font-size:10px;}
.dashtoolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.dashtoolbar select{font-size:13px; padding:8px 10px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--text);}
.dashthumb{width:44px; height:44px; border-radius:8px; overflow:hidden; background:var(--bg); border:1px solid var(--border);}
.dashthumb.clickable{cursor:zoom-in;}
.dashthumb img{width:100%; height:100%; object-fit:cover;}
.dashthumb .ph{font-size:16px; color:var(--sub); display:flex; align-items:center; justify-content:center; height:100%;}
.tqty{font-weight:700; white-space:nowrap;}
.tqty.ok{color:var(--mint);} .tqty.low{color:var(--orange);} .tqty.zero{color:var(--slate);}
.iconbtn{width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer; font-size:12px; display:inline-flex; align-items:center; justify-content:center;}
.iconbtn.danger{color:#e5484d; border-color:#e5484d;}

.pager{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:12.5px; color:var(--sub);}
.pager .pages{display:flex; gap:4px; align-items:center;}
.pager button{min-width:30px; height:30px; border-radius:7px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; font-size:12px;}
.pager button.active{background:var(--blue); color:var(--blue-ink); border-color:var(--blue); font-weight:700;}
.pager button:disabled{opacity:.4; cursor:default;}
.pager select{font-size:12px; padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--card); color:var(--text);}

.empty{text-align:center; color:var(--sub); padding:50px 20px; font-size:13px;}

.settingsbox{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; max-width:560px; margin-bottom:16px;}
.settingsbox h3{margin:0 0 10px; font-size:14px;}
.settingsbox p{font-size:12.5px; color:var(--sub); margin:0 0 14px;}
.settingsbox button.exportbtn{font-size:13px; padding:10px 16px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer;}
.editorrow{display:flex; gap:8px; align-items:center; padding:4px 0; font-size:12.5px;}
.editorrow span{flex:1;}
.editorrow button{font-size:11px; padding:3px 8px; border-radius:6px; border:1px solid #e5484d; color:#e5484d; background:none; cursor:pointer;}
.addeditor{display:flex; gap:6px; margin-top:8px;}
.addeditor input{flex:1; font-size:13px; padding:8px 10px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
.addeditor button{padding:8px 12px; border-radius:7px; border:none; background:var(--blue); color:var(--blue-ink); font-size:12px; cursor:pointer;}
.seedbtn{padding:9px 14px; border-radius:8px; border:none; background:var(--mint); color:#04231a; cursor:pointer; margin-bottom:10px; font-weight:700;}

.fab{position:fixed; left:calc(220px + 16px); bottom:20px; background:var(--blue); color:var(--blue-ink); border:none; border-radius:999px; padding:13px 18px; font-size:14px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; z-index:6;}

.overlay{position:fixed; inset:0; background:rgba(20,22,26,.6); display:flex; align-items:flex-end; justify-content:center; z-index:30;}
@media (min-width:640px){ .overlay{align-items:center;} }
.modal{background:var(--card); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:18px;}
@media (min-width:640px){ .modal{border-radius:16px;} }
.modal h2{margin:0 0 12px; font-size:16px;}
.field{margin-bottom:10px; display:flex; flex-direction:column; gap:4px;}
.field label{font-size:12px; color:var(--sub);}
.field input,.field select{width:100%; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
.imgpick{display:flex; gap:10px; align-items:center;}
.imgpick .prev{width:64px; height:64px; border-radius:8px; background:var(--bg); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid var(--border);}
.imgpick .prev img{width:100%; height:100%; object-fit:cover;}
.modalbtns{display:flex; gap:8px; margin-top:14px;}
.modalbtns button{flex:1; padding:11px; border-radius:9px; border:1px solid var(--border); font-size:14px; cursor:pointer; background:var(--bg); color:var(--text);}
.modalbtns button.primary{background:var(--blue); color:var(--blue-ink); border-color:var(--blue); font-weight:700;}

.lightbox{position:fixed; inset:0; background:rgba(15,17,21,.72); display:flex; align-items:center; justify-content:center; z-index:40; padding:24px;}
.lightbox .lbclose{position:absolute; top:18px; right:18px; background:rgba(255,255,255,.18); color:#fff; border:none; width:36px; height:36px; border-radius:999px; font-size:16px; cursor:pointer;}
.lightbox .lbcard{background:#fff; border-radius:18px; padding:22px; max-width:min(92vw,560px); max-height:88vh; display:flex; align-items:center; justify-content:center; box-shadow:0 20px 60px rgba(0,0,0,.4);}
.lightbox .lbcard img{max-width:100%; max-height:76vh; object-fit:contain; border-radius:8px;}

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; z-index:50; opacity:0; transition:opacity .2s;}
.toast.show{opacity:1;}

@media (max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .mainarea{margin-left:0;}
  .hamburger{display:block;}
  .sidebar-overlay.show{display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:14;}
  .topbar input[type=text]{max-width:none;}
  .herocta{font-size:11px; padding:8px 14px;}
  .fab{left:16px;}
}
</style>
</head>

function colorSwatch(c){
  if(!c) return '#d1d5db';
  const lc = c.toLowerCase().trim();
  for(const k in COLOR_MAP){ if(lc.includes(k.toLowerCase())) return COLOR_MAP[k]; }
  return '#d1d5db';
}
function extractSize(name){
  if(!name) return '-';
  const m = name.match(/(\d+(\.\d+)?\s?(oz|ml|l|ลิตร|มล))/i);
  return m ? m[1].replace(/\s+/g,'').toUpperCase() : '-';
}
function modelKeyOf(p){
  const code = p.erp_code || p.code || '';
  if(!code) return 'id:' + p.id;
  const m = code.match(/^(.*)\/\d+$/);
  return m ? m[1] : code;
}
function countModels(items){
  return new Set(items.map(modelKeyOf)).size;
}
function naturalCompare(a, b){
  const re = /(\d+)|(\D+)/g;
  const ax = [], bx = [];
  String(a||'').replace(re, (_, num, str) => { ax.push([num ? parseInt(num,10) : Infinity, str || '']); return ''; });
  String(b||'').replace(re, (_, num, str) => { bx.push([num ? parseInt(num,10) : Infinity, str || '']); return ''; });
  while(ax.length && bx.length){
    const an = ax.shift(), bn = bx.shift();
    const diff = (an[0]-bn[0]) || an[1].localeCompare(bn[1]);
    if(diff) return diff;
  }
  return ax.length - bx.length;
}
function sortByCode(items){
  return items.slice().sort((a,b) => naturalCompare(a.erp_code||a.code||a.name||'', b.erp_code||b.code||b.name||''));
}

  if(!iso) return '-';

}

function updateBell(){
  const alertItems = products.filter(p=>qtyStatus(p.qty)!=='ok').sort((a,b)=>(a.qty||0)-(b.qty||0));
  const n = alertItems.length;
  const bc = $('bellCount');
  if(n>0){ bc.textContent = n>99?'99+':n; bc.style.display='block'; } else { bc.style.display='none'; }

  const LIMIT = 8;
  const shown = alertItems.slice(0, LIMIT);
  const rowsHtml = shown.map(p => {
    const st = qtyStatus(p.qty);
    return `<div class="bmrow" data-bmid="${p.id}">
      <div class="bmthumb">${p.img?`<img src="${toSrc(p.img)}">`:'🥤'}</div>
      <div class="bminfo">
        <div class="bmcode">${p.erp_code||p.code||p.name||''}</div>
        <div class="bmsub">${p.category||''}${p.color?(' · '+p.color):''}</div>
      </div>
      <div class="bmqty ${st}">${(p.qty||0).toLocaleString()} ชิ้น</div>
    </div>`;
  }).join('');

  $('bellMenu').innerHTML = `
    <div class="bmhead">สินค้าที่ต้องเฝ้าระวัง (${n})</div>
    ${n===0 ? `<div class="bmempty">ยังไม่มีรายการที่ต้องเฝ้าระวังตอนนี้ 🎉</div>` : rowsHtml}
    ${n>LIMIT ? `<div class="bmmore">และอีก ${n-LIMIT} รายการ</div>` : ''}
  `;
  $('bellMenu').querySelectorAll('[data-bmid]').forEach(row => {
    row.onclick = () => {
      const item = products.find(p => p.id === row.dataset.bmid);
      if(!item) return;
      closeAllKebabMenus();
      $('search').value = item.erp_code || item.code || '';
      setView(item.category);
    };
  });
}
$('bell').onclick = (e) => {
  e.stopPropagation();
  const menu = $('bellMenu');
  const isOpen = menu.classList.contains('show');
  closeAllKebabMenus();
  if(!isOpen) menu.classList.add('show');
};

    const collage = CAT_COLLAGE[c];
    const withImg = items.find(p=>p.img);
    const qty = items.reduce((s,p)=>s+(p.qty||0),0);
    const models = countModels(items);
    const imgSrc = collage || (withImg ? toSrc(withImg.img_full||withImg.img) : null);
    return `<div class="catcard${c===activeCat?' active':''}">
      <div class="catimg">${imgSrc?`<img src="${imgSrc}">`:'🥤'}</div>
      <div class="catinfo">
        <div class="catname">${c}</div>
        <div class="catstatsrow">
          <div class="catstat"><span>จำนวนรุ่น</span><b>${models.toLocaleString()} รุ่น</b></div>
          <div class="catstat"><span>รวมทั้งหมด</span><b>${items.length} รายการ</b></div>
          <div class="catstat"><span>คงเหลือรวม</span><b>${qty.toLocaleString()} ชิ้น</b></div>
        </div>
        <button data-goto="${c}">ดูสต๊อก →</button>
      </div>
    </div>`;
  }).join('');
}

let dashPage = 1, dashPageSize = 15, dashCatFilter = 'ALL', dashStatusFilter = 'ALL', dashSizeFilter = 'ALL', dashQtyFilter = 'ALL';

function renderDashTable(){
  const q = $('search').value.trim().toLowerCase();
  let items = products;
  if(q) items = items.filter(p => (p.code||'').toLowerCase().includes(q) || (p.erp_code||'').toLowerCase().includes(q) || (p.name||'').toLowerCase().includes(q) || (p.color||'').toLowerCase().includes(q));
  if(dashCatFilter !== 'ALL') items = items.filter(p => p.category === dashCatFilter);
  if(dashStatusFilter !== 'ALL') items = items.filter(p => qtyStatus(p.qty) === dashStatusFilter);
  if(dashSizeFilter !== 'ALL') items = items.filter(p => extractSize(p.name) === dashSizeFilter);
  if(dashQtyFilter !== 'ALL') items = items.filter(p => (p.qty||0) > parseInt(dashQtyFilter));
  items = sortByCode(items);

  const sizes = [...new Set(products.map(p=>extractSize(p.name)))].filter(s=>s!=='-').sort();

  const totalPages = Math.max(1, Math.ceil(items.length / dashPageSize));
  if(dashPage > totalPages) dashPage = totalPages;
  const pageItems = items.slice((dashPage-1)*dashPageSize, dashPage*dashPageSize);

  const rows = pageItems.map(p => {
    const st = qtyStatus(p.qty);
    const size = extractSize(p.name);
    return `<tr>
      <td><div class="pcode">${p.erp_code||''}</div><div class="pcode" style="opacity:.7">${p.code||''}</div></td>
      <td><div class="dashthumb${p.img?' clickable':''}" ${p.img?`data-lightbox="${toSrc(p.img_full||p.img)}"`:''}>${p.img?`<img src="${toSrc(p.img_full||p.img)}">`:'<div class="ph">🥤</div>'}</div></td>
      <td><span class="colordot" style="background:${colorSwatch(p.color)}"></span>${p.color||'-'}</td>
      <td>${size}</td>
      <td class="tqty ${st}">${(p.qty||0).toLocaleString()} ชิ้น</td>
      <td>${p.pending ? p.pending+' ชิ้น' : '-'}</td>
      <td>${p.incoming_qty ? Number(p.incoming_qty).toLocaleString()+' ชิ้น' : '-'}</td>
      <td>${formatDateTH(p.arrival_date)}</td>
      <td><span class="pstatus ${st}" style="position:static">${statusLabel(st)}</span></td>
      ${canEdit?`<td><div style="display:flex;gap:5px;"><button class="iconbtn" data-act="edit" data-id="${p.id}">✎</button><button class="iconbtn danger" data-act="del" data-id="${p.id}">🗑</button></div></td>`:''}
    </tr>`;
  }).join('');

  const pagerHtml = `
    <div class="pager">
      <div>แสดง ${items.length ? ((dashPage-1)*dashPageSize+1) : 0}-${Math.min(dashPage*dashPageSize,items.length)} จาก ${items.length} รายการ</div>
      <div class="pages">
        <button id="dashPrev" ${dashPage<=1?'disabled':''}>‹</button>
        ${Array.from({length: totalPages}, (_,i)=>i+1).filter(n => n===1||n===totalPages||Math.abs(n-dashPage)<=1).reduce((acc,n,i,arr)=>{
          if(i>0 && n-arr[i-1]>1) acc += `<span>…</span>`;
          acc += `<button data-dpage="${n}" class="${n===dashPage?'active':''}">${n}</button>`;
          return acc;
        },'')}
        <button id="dashNext" ${dashPage>=totalPages?'disabled':''}>›</button>
      </div>
      <div>แสดงต่อ <select id="dashPageSizeSel">${PAGE_SIZE_OPTIONS.map(n=>`<option value="${n}" ${n===dashPageSize?'selected':''}>${n}</option>`).join('')}</select></div>
    </div>`;

  $('dashTableWrap').innerHTML = `
    <div class="dashtoolbar">
      <select id="dashCatFilter"><option value="ALL">ทุกหมวดหมู่</option>${CATEGORIES.map(c=>`<option ${c===dashCatFilter?'selected':''}>${c}</option>`).join('')}</select>
      <select id="dashSizeFilter"><option value="ALL">ขนาดทั้งหมด</option>${sizes.map(s=>`<option ${s===dashSizeFilter?'selected':''}>${s}</option>`).join('')}</select>
      <select id="dashStatusFilter">
        <option value="ALL" ${dashStatusFilter==='ALL'?'selected':''}>สถานะทั้งหมด</option>
        <option value="ok" ${dashStatusFilter==='ok'?'selected':''}>พร้อมขาย</option>
        <option value="low" ${dashStatusFilter==='low'?'selected':''}>เหลือน้อย</option>
        <option value="zero" ${dashStatusFilter==='zero'?'selected':''}>รอเติม Stock</option>
      </select>
      <select id="dashQtyFilter">
        <option value="ALL">คงเหลือทั้งหมด</option>
        ${QTY_FILTER_OPTIONS.map(n=>`<option value="${n}" ${String(n)===dashQtyFilter?'selected':''}>คงเหลือมากกว่า ${n.toLocaleString()}</option>`).join('')}
      </select>
    </div>
    ${pageItems.length ? `
    <div class="alerttable"><table>
      <thead><tr>
        <th>รหัสสินค้า</th><th>รูปแบบ</th><th>สี</th><th>ขนาด</th><th>คงเหลือ</th>
        <th>รอใช้ออเดอร์</th><th>กำลังสั่งเข้า</th><th>วันที่ของเข้า</th><th>สถานะ</th>${canEdit?'<th>จัดการ</th>':''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${pagerHtml}` : `<div class="empty">ไม่พบสินค้า</div>`}
  `;

  $('dashCatFilter').onchange = (e) => { dashCatFilter = e.target.value; dashPage = 1; renderDashTable(); };
  $('dashSizeFilter').onchange = (e) => { dashSizeFilter = e.target.value; dashPage = 1; renderDashTable(); };
  $('dashStatusFilter').onchange = (e) => { dashStatusFilter = e.target.value; dashPage = 1; renderDashTable(); };
  $('dashQtyFilter').onchange = (e) => { dashQtyFilter = e.target.value; dashPage = 1; renderDashTable(); };
  const dpss = $('dashPageSizeSel');
  if(dpss) dpss.onchange = () => { dashPageSize = parseInt(dpss.value); dashPage = 1; renderDashTable(); };
  $('mainContent').querySelectorAll('[data-dpage]').forEach(b => b.onclick = () => { dashPage = parseInt(b.dataset.dpage); renderDashTable(); });
  const dprev = $('dashPrev'), dnext = $('dashNext');
  if(dprev) dprev.onclick = () => { if(dashPage>1){ dashPage--; renderDashTable(); } };
  if(dnext) dnext.onclick = () => { dashPage++; renderDashTable(); };
  $('mainContent').querySelectorAll('.dashthumb.clickable').forEach(el => el.onclick = () => openLightbox(el.dataset.lightbox));
  $('mainContent').querySelectorAll('button[data-act]').forEach(btn => {
    btn.onclick = () => {
      const item = products.find(p => p.id === btn.dataset.id);
      if(btn.dataset.act === 'edit') openModal(item);
      else if(btn.dataset.act === 'del') deleteItem(item);
    };
  });
}

function buildModelBreakdown(){
  return CATEGORIES.map(cat => {
    const items = itemsFor(cat);
    const groups = {};
    items.forEach(p => { (groups[modelKeyOf(p)] = groups[modelKeyOf(p)] || []).push(p); });
    const keys = Object.keys(groups).sort(naturalCompare);
    const rows = keys.map(k => `<tr>
      <td class="pcode">${k}</td>
      <td>${groups[k].length} สี</td>
      <td>${groups[k].map(p=>p.color||'-').join(', ')}</td>
    </tr>`).join('');
    return `<details class="modelbreak">
      <summary>${cat} — นับได้ ${keys.length} รุ่น (${items.length} รายการ)</summary>
      <div class="alerttable"><table style="min-width:0;">
        <thead><tr><th>รหัสรุ่น</th><th>จำนวนสี</th><th>สีที่มี</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </details>`;
  }).join('');
}

function findDuplicateCodes(){
  const byCode = {};
  products.forEach(p => {
    const code = (p.erp_code || p.code || '').trim();
    if(!code) return;
    (byCode[code] = byCode[code] || []).push(p);
  });
  return Object.entries(byCode).filter(([code, items]) => items.length > 1);
}

function exportCSV(){
  const rows = [['รหัสERP','รหัสสินค้า','ชื่อ/ขนาด','หมวดหมู่','สี','คงเหลือ','รอออเดอร์','สถานะ']];
  products.forEach(p => rows.push([p.erp_code,p.code,p.name,p.category,p.color,p.qty,p.pending||'',statusLabel(qtyStatus(p.qty))]));
  const csv = rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'stock-glass.csv'; a.click();
}

$('poSaveBtn').onclick = async () => {
  if(!canEdit){ toast('คุณไม่มีสิทธิ์แก้ไข'); return; }
  const product = products.find(p => p.id === $('poProduct').value);
  if(!product){ toast('กรุณาเลือกสินค้า'); return; }
  const qty = parseInt($('poQty').value) || 0;
  if(qty <= 0){ toast('กรุณาระบุจำนวนที่สั่งซื้อ'); return; }

  const po = {
    id: 'po_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    productId: product.id,
    productCode: product.erp_code || product.code || '',
    productName: product.name || '',
    category: product.category,
    qty,
    supplier: $('poSupplier').value.trim(),
    orderDate: $('poOrderDate').value || new Date().toISOString().slice(0,10),
    expectedDate: $('poExpected').value || null,
    note: $('poNote').value.trim(),
    status: 'pending',
    receivedDate: null,
    createdAt: Date.now(),
    createdBy: currentUser ? currentUser.email : null,
  };

  try{
    await setDoc(doc(db, 'purchase_orders', po.id), po);
    const updatedProduct = {
      ...product,
      incoming_qty: (parseInt(product.incoming_qty) || 0) + qty,
      arrival_date: po.expectedDate || product.arrival_date || null,
    };
    await setDoc(doc(db, 'products', product.id), updatedProduct);
    $('poOverlay').style.display = 'none';
    toast('สร้างใบสั่งซื้อเรียบร้อย');
  }catch(err){ toast('บันทึกไม่สำเร็จ: ' + err.message); }
};

async function receivePO(po){
  if(!canEdit || !po || po.status === 'received') return;
  try{
    await setDoc(doc(db, 'purchase_orders', po.id), { ...po, status: 'received', receivedDate: new Date().toISOString().slice(0,10) });
    const product = products.find(p => p.id === po.productId);
    if(product){
      const newIncoming = Math.max(0, (parseInt(product.incoming_qty) || 0) - po.qty);
      const updatedProduct = { ...product, qty: (product.qty || 0) + po.qty, incoming_qty: newIncoming || null, arrival_date: newIncoming ? product.arrival_date : null };
      await setDoc(doc(db, 'products', product.id), updatedProduct);
    }
    toast('รับของเข้าสต็อกเรียบร้อย');
  }catch(err){ toast('ดำเนินการไม่สำเร็จ: ' + err.message); }
}

async function deletePO(po){
  if(!canEdit || !po) return;
  if(!confirm('ลบใบสั่งซื้อนี้?')) return;
  try{
    if(po.status === 'pending'){
      const product = products.find(p => p.id === po.productId);
      if(product){
        const newIncoming = Math.max(0, (parseInt(product.incoming_qty) || 0) - po.qty);
        const updatedProduct = { ...product, incoming_qty: newIncoming || null, arrival_date: newIncoming ? product.arrival_date : null };
        await setDoc(doc(db, 'products', product.id), updatedProduct);
      }
    }
    await deleteDoc(doc(db, 'purchase_orders', po.id));
    toast('ลบใบสั่งซื้อแล้ว');
  }catch(err){ toast('ลบไม่สำเร็จ: ' + err.message); }
}

function renderCategory(catOrAll){
  const isAll = catOrAll === 'ALL';
  let items = isAll ? products : itemsFor(catOrAll);

  const q = $('search').value.trim().toLowerCase();
  const sizeF = $('mainContent').querySelector('#sizeFilter')?.value || 'ALL';
  const colorF = $('mainContent').querySelector('#colorFilter')?.value || 'ALL';
  const statusF = $('mainContent').querySelector('#statusFilter')?.value || 'ALL';
  const qtyF = $('mainContent').querySelector('#qtyFilter')?.value || 'ALL';

  const sizes = [...new Set(items.map(p=>extractSize(p.name)))].filter(s=>s!=='-').sort();
  const colors = [...new Set(items.map(p=>p.color).filter(Boolean))].sort();

  let filtered = items;
  if(q) filtered = filtered.filter(p => (p.code||'').toLowerCase().includes(q) || (p.erp_code||'').toLowerCase().includes(q) || (p.name||'').toLowerCase().includes(q) || (p.color||'').toLowerCase().includes(q));
  if(sizeF !== 'ALL') filtered = filtered.filter(p => extractSize(p.name) === sizeF);
  if(colorF !== 'ALL') filtered = filtered.filter(p => p.color === colorF);
  if(statusF !== 'ALL') filtered = filtered.filter(p => qtyStatus(p.qty) === statusF);
  if(qtyF !== 'ALL') filtered = filtered.filter(p => (p.qty||0) > parseInt(qtyF));
  filtered = sortByCode(filtered);

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if(page > totalPages) page = totalPages;
  const pageItems = filtered.slice((page-1)*pageSize, page*pageSize);

  const cardsHtml = pageItems.map(p => {
    const st = qtyStatus(p.qty);
    const size = extractSize(p.name);
    const menuId = 'pm_' + p.id;
    return `<div class="pcard">
      <span class="pstatus ${st}">${statusLabel(st)}</span>
      ${canEdit?`<button class="pkebab" data-kebab="${menuId}">⋮</button>
      <div class="pkebabmenu" id="${menuId}">
        <button data-act="edit" data-id="${p.id}">✎ แก้ไข</button>
        <button class="danger" data-act="del" data-id="${p.id}">🗑 ลบ</button>
      </div>`:''}
      <div class="pcardtop">
        <div class="pimg${p.img?' clickable':''}" ${p.img?`data-lightbox="${toSrc(p.img_full||p.img)}"`:''}>${p.img?`<img src="${toSrc(p.img_full||p.img)}">`:'<div class="ph">🥤</div>'}</div>
        <div class="pinfo">
          <div class="pcode">${p.erp_code||p.code||''}</div>
          <div class="prow"><span>ขนาด</span><b>${size}</b></div>
          <div class="prow"><span>สี</span><span><span class="colordot" style="background:${colorSwatch(p.color)}"></span>${p.color||'-'}</span></div>
          <div class="prow"><span>รูปแบบ</span><b>${p.category||''}</b></div>
        </div>
      </div>
      <div class="stockbox">
        <div class="stocktitle">จำนวนคงเหลือ</div>
        <div class="prow"><span>คงเหลือ</span><b class="qty-${st}">${(p.qty||0).toLocaleString()} ชิ้น</b></div>
        ${p.pending?`<div class="prow"><span>รอใช้ออเดอร์</span><b class="pendingval">${p.pending} ชิ้น</b></div>`:''}
        ${p.incoming_qty?`<div class="prow"><span>รอเข้า</span><b class="incomingval">${Number(p.incoming_qty).toLocaleString()} ชิ้น</b></div>`:''}
      </div>
      ${p.arrival_date?`<div class="pfooter"><div class="datebadge"><span class="dot">📅</span>วันที่ของเข้า</div><b>${formatDateTH(p.arrival_date)}</b></div>`:''}
    </div>`;
  }).join('');

  const pagerHtml = `
    <div class="pager">
      <div>แสดง ${filtered.length ? ((page-1)*pageSize+1) : 0}-${Math.min(page*pageSize,filtered.length)} จาก ${filtered.length} รายการ</div>
      <div class="pages">
        <button id="prevPage" ${page<=1?'disabled':''}>‹</button>
        ${Array.from({length: totalPages}, (_,i)=>i+1).filter(n => n===1||n===totalPages||Math.abs(n-page)<=1).reduce((acc,n,i,arr)=>{
          if(i>0 && n-arr[i-1]>1) acc += `<span>…</span>`;
          acc += `<button data-page="${n}" class="${n===page?'active':''}">${n}</button>`;
          return acc;
        },'')}
        <button id="nextPage" ${page>=totalPages?'disabled':''}>›</button>
      </div>
      <div>แสดงต่อ <select id="pageSizeSel">${PAGE_SIZE_OPTIONS.map(n=>`<option value="${n}" ${n===pageSize?'selected':''}>${n}</option>`).join('')}</select></div>
    </div>`;

  $('mainContent').innerHTML = `
    <div class="pagehead"><h1>${isAll ? 'สต็อกสินค้าทั้งหมด' : catOrAll}</h1><div class="meta">รายการสต็อกสินค้า${isAll?'':': '+catOrAll}</div></div>
    <div class="sectiontitle">ภาพรวมสต็อกสินค้า</div>
    <div class="catcards">${buildCatOverviewCards(isAll ? null : catOrAll)}</div>
    <div class="sectiontitle">รายการสต็อกสินค้า${isAll?'ทั้งหมด':': '+catOrAll}</div>
    <div class="toolbar">
      <input type="text" id="catsearch" placeholder="ค้นหารหัส / ชื่อรุ่น" value="${q}">
      <select id="sizeFilter"><option value="ALL">ขนาดทั้งหมด</option>${sizes.map(s=>`<option ${s===sizeF?'selected':''}>${s}</option>`).join('')}</select>
      <select id="colorFilter"><option value="ALL">สีทั้งหมด</option>${colors.map(c=>`<option ${c===colorF?'selected':''}>${c}</option>`).join('')}</select>
      <select id="statusFilter">
        <option value="ALL" ${statusF==='ALL'?'selected':''}>สถานะทั้งหมด</option>
        <option value="ok" ${statusF==='ok'?'selected':''}>พร้อมขาย</option>
        <option value="low" ${statusF==='low'?'selected':''}>เหลือน้อย</option>
        <option value="zero" ${statusF==='zero'?'selected':''}>รอเติม Stock</option>
      </select>
      <select id="qtyFilter">
        <option value="ALL">คงเหลือทั้งหมด</option>
        ${QTY_FILTER_OPTIONS.map(n=>`<option value="${n}" ${String(n)===qtyF?'selected':''}>คงเหลือมากกว่า ${n.toLocaleString()}</option>`).join('')}
      </select>
      <div class="spacer"></div>
      ${canEdit?`<button class="addnew" id="addNewBtn">+ เพิ่มสินค้าใหม่</button>`:''}
    </div>
    ${pageItems.length ? `<div class="pgrid">${cardsHtml}</div>${pagerHtml}` : `<div class="empty">ไม่พบสินค้า</div>`}
  `;

  const s = $('catsearch');
  s.oninput = () => { $('search').value = s.value; page = 1; renderCategory(catOrAll); };
  s.focus(); s.setSelectionRange(s.value.length, s.value.length);
  const sf = $('sizeFilter'), cf = $('colorFilter'), stf = $('statusFilter'), qf = $('qtyFilter');
  [sf,cf,stf,qf].forEach(el => el && (el.onchange = () => { page = 1; renderCategory(catOrAll); }));
  const pss = $('pageSizeSel');
  if(pss) pss.onchange = () => { pageSize = parseInt(pss.value); page = 1; renderCategory(catOrAll); };
  $('mainContent').querySelectorAll('[data-page]').forEach(b => b.onclick = () => { page = parseInt(b.dataset.page); renderCategory(catOrAll); });
  const prevBtn = $('prevPage'), nextBtn = $('nextPage');
  if(prevBtn) prevBtn.onclick = () => { if(page>1){ page--; renderCategory(catOrAll); } };
  if(nextBtn) nextBtn.onclick = () => { page++; renderCategory(catOrAll); };
  const addBtn = $('addNewBtn');
  if(addBtn) addBtn.onclick = () => openModal(null, isAll ? CATEGORIES[0] : catOrAll);

  $('mainContent').querySelectorAll('[data-goto]').forEach(b => b.onclick = () => setView(b.dataset.goto));
  $('mainContent').querySelectorAll('.pimg.clickable').forEach(el => el.onclick = () => openLightbox(el.dataset.lightbox));
  $('mainContent').querySelectorAll('button[data-act]').forEach(btn => {
    btn.onclick = () => {
      const item = products.find(p => p.id === btn.dataset.id);
      if(btn.dataset.act === 'edit') openModal(item);
      else if(btn.dataset.act === 'del') deleteItem(item);
      closeAllKebabMenus();
    };
  });
  $('mainContent').querySelectorAll('[data-kebab]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const menu = $(btn.dataset.kebab);
      const isOpen = menu.classList.contains('show');
      closeAllKebabMenus();
      if(!isOpen) menu.classList.add('show');
    };
  });
}

function closeAllKebabMenus(){
  document.querySelectorAll('.pkebabmenu.show, .bellmenu.show').forEach(m => m.classList.remove('show'));
}
document.addEventListener('click', closeAllKebabMenus);

$('search').oninput = () => {
  if(view==='settings') return;
  if(view==='dashboard'){ dashPage = 1; renderDashTable(); return; }
  page = 1; renderCategory(view);
};

function applyTheme(mode){
  if(mode === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  const isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const btn = $('themeBtn');
  if(btn) btn.textContent = isDark ? '☀️' : '🌙';
}
function initTheme(){
  let saved = 'auto';
  try{ saved = localStorage.getItem('stockTheme') || 'auto'; }catch(e){}
  applyTheme(saved);
  $('themeBtn').onclick = () => {
    let cur = 'auto';
    try{ cur = localStorage.getItem('stockTheme') || 'auto'; }catch(e){}
    const isDarkNow = cur === 'dark' || (cur === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = isDarkNow ? 'light' : 'dark';
    try{ localStorage.setItem('stockTheme', next); }catch(e){}
    applyTheme(next);
  };
}
initTheme();

function openLightbox(src){
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<button class="lbclose">✕</button><div class="lbcard"><img src="${src}"></div>`;
  lb.onclick = (e) => { if(e.target === lb || e.target.classList.contains('lbclose')) lb.remove(); };
  document.body.appendChild(lb);
}

function openModal(item, presetCategory){
  editingId = item ? item.id : null;
  $('modalTitle').textContent = item ? 'แก้ไขสินค้า' : 'เพิ่มสินค้า';
  const sel = $('f_category');
  sel.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  sel.value = item ? item.category : (presetCategory || CATEGORIES[0]);
  $('f_erp').value = item ? item.erp_code : '';
  $('f_code').value = item ? item.code : '';
  $('f_name').value = item ? item.name : '';
  $('f_color').value = item ? item.color : '';
  $('f_qty').value = item ? item.qty : 0;
  $('f_pending').value = item ? item.pending : '';
  $('f_incoming').value = item && item.incoming_qty ? item.incoming_qty : '';
  $('f_arrival').value = item && item.arrival_date ? item.arrival_date : '';
  $('f_imgfile').value = '';
  const imgSrc = toSrc(item && (item.img_full || item.img));
  $('f_imgprev').innerHTML = imgSrc ? `<img src="${imgSrc}">` : '🖼️';
  $('f_imgprev').dataset.b64 = item && item.img ? item.img : '';
  $('f_imgprev').dataset.b64full = item && (item.img_full||item.img) ? (item.img_full||item.img) : '';
  $('overlay').style.display = 'flex';
}
function closeModal(){ $('overlay').style.display = 'none'; editingId = null; }
$('fabAdd').onclick = () => openModal(null, CATEGORIES.includes(view) ? view : CATEGORIES[0]);
$('cancelBtn').onclick = closeModal;

$('f_imgfile').onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      function resized(maxdim, quality){
        let w = img.width, h = img.height;
        if(w > h){ if(w>maxdim){ h = Math.round(h*maxdim/w); w = maxdim; } }
        else { if(h>maxdim){ w = Math.round(w*maxdim/h); h = maxdim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        return canvas.toDataURL('image/jpeg', quality);
      }
      const thumbUrl = resized(160, 0.7);
      const fullUrl = resized(1000, 0.85);
      $('f_imgprev').innerHTML = `<img src="${thumbUrl}">`;
      $('f_imgprev').dataset.b64 = thumbUrl;
      $('f_imgprev').dataset.b64full = fullUrl;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

$('saveBtn').onclick = async () => {
  if(!canEdit){ toast('คุณไม่มีสิทธิ์แก้ไข'); return; }
  const item = {
    id: editingId || ('P' + Date.now()),
    category: $('f_category').value,
    erp_code: $('f_erp').value.trim(),
    code: $('f_code').value.trim(),
    name: $('f_name').value.trim(),
    color: $('f_color').value.trim(),
    qty: parseInt($('f_qty').value) || 0,
    pending: $('f_pending').value.trim(),
    incoming_qty: $('f_incoming').value ? parseInt($('f_incoming').value) : null,
    arrival_date: $('f_arrival').value.trim() || null,
    img: $('f_imgprev').dataset.b64 || null,
    img_full: $('f_imgprev').dataset.b64full || null,
    updatedAt: Date.now(),
    updatedBy: currentUser ? currentUser.email : null,
  };
  if(!item.name){ toast('กรุณากรอกชื่อสินค้า'); return; }
  try{ await setDoc(doc(db, 'products', item.id), item); toast('บันทึกแล้ว'); closeModal(); }
  catch(err){ toast('บันทึกไม่สำเร็จ: ' + err.message); }
};

async function deleteItem(item){
  if(!canEdit) return;
  if(!confirm('ลบสินค้า "' + item.name + '" ใช่หรือไม่?')) return;
  try{ await deleteDoc(doc(db, 'products', item.id)); toast('ลบแล้ว'); }
  catch(err){ toast('ลบไม่สำเร็จ: ' + err.message); }
}

async function seedIfEmpty(){
  const snap = await getDocs(collection(db, 'products'));
  if(!snap.empty) { toast('มีข้อมูลอยู่แล้ว ไม่ seed ซ้ำ'); return; }
  try{ await loadSeed(); }catch(e){ toast(e.message); return; }
  const batch = writeBatch(db);
  SEED_PRODUCTS.forEach(p => {
    const ref = doc(db, 'products', p.id);
    batch.set(ref, { ...p, img: p.img ? ('data:image/jpeg;base64,'+p.img) : null, img_full: p.img_full ? ('data:image/jpeg;base64,'+p.img_full) : null, updatedAt: Date.now() });
  });
  await batch.commit();
  toast('โหลดข้อมูลเริ่มต้นสำเร็จ (' + SEED_PRODUCTS.length + ' รายการ)');
}

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  isSuperAdmin = !!(user && user.email && user.email.toLowerCase() === SUPERADMIN_EMAIL.toLowerCase());
  canEdit = false;
  if(user){
    try{ const edoc = await getDoc(doc(db, 'editors', user.email.toLowerCase())); canEdit = isSuperAdmin || edoc.exists(); }
    catch(e){ canEdit = isSuperAdmin; }
  }
  renderAuthbox();
  $('fabAdd').style.display = canEdit ? 'block' : 'none';
  render();
});

onSnapshot(collection(db, 'products'), (snap) => { products = snap.docs.map(d => d.data()); loaded = true; loadError=''; clearTimeout(loadTimer); render(); },
  (err) => { loadError = 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ (' + (err && err.code || 'error') + ') กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'; if(!loaded) render(); toast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ'); });
const loadTimer = setTimeout(()=>{ if(!loaded){ loadError='โหลดข้อมูลนานผิดปกติ อินเทอร์เน็ตอาจช้าหรือถูกบล็อก'; render(); } }, 15000);

onSnapshot(collection(db, 'purchase_orders'), (snap) => { purchaseOrdersArr = snap.docs.map(d => d.data()); if(view === 'purchase') render(); });

onSnapshot(doc(db, 'settings', 'general'), (d) => { settingsDoc = d.exists() ? d.data() : {}; if(view === 'dashboard') render(); });

renderNav();
render();
window.__stockStarted = true;
</script>
</body>
